name: Update Submodules and Publish

on:
  workflow_dispatch:
  repository_dispatch:
    types: [update-submodules]
  push:
    branches:
      - gh-pages-source

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-submodules:
    runs-on: ubuntu-latest
    env:
      GIT_USER_NAME: "Eclipse Keyple Bot"
      GIT_USER_EMAIL: "${{ github.repository }}-bot@eclipse.org"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: gh-pages-source
          submodules: recursive
          fetch-depth: 0

      - name: Set Git identity
        run: |
          git config --global user.name "${GIT_USER_NAME}"
          git config --global user.email "${GIT_USER_EMAIL}"

      - name: Prepare clean repository
        id: prepare
        run: bash scripts/prepare_clean_repo.sh
        env:
          GITHUB_ENV: ${{ github.env }}

      - name: Clean old patch versions
        id: clean_versions
        run: bash scripts/clean_versions.sh
        env:
          CLEAN_REPO: ${{ env.CLEAN_REPO }}

      - name: Generate UML documentation
        id: uml
        run: bash scripts/generate_uml.sh
        env:
          CLEAN_REPO: ${{ env.CLEAN_REPO }}

      - name: Push to gh-pages
        run: bash scripts/push_gh_pages.sh
        env:
          CLEAN_REPO: ${{ env.CLEAN_REPO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
